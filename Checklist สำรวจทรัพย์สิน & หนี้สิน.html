const wrap=document.getElementById('sec-wrap');
SECTIONS.forEach(s=>{
  const div=document.createElement('div');
  div.className='section '+s.col;
  const items=s.items.map(it=>{
    let tags='';
    if(it.w)tags+=`<span class="tag-warn"><i class="ti ti-alert-triangle" style="font-size:12px" aria-hidden="true"></i>${it.w}</span><br>`;
    if(it.d)tags+=`<span class="tag-danger"><i class="ti ti-flame" style="font-size:12px" aria-hidden="true"></i>${it.d}</span><br>`;
    return`<div class="item" id="row-${it.id}"><label><input type="checkbox" id="${it.id}" onchange="onChk(this)"><div style="flex:1"><div class="it-title">${it.t}</div><div class="it-hint">${it.h}</div>${tags}<button class="note-btn" id="nb-${it.id}" onclick="toggleNote('${it.id}')"><i class="ti ti-pencil" style="font-size:12px" aria-hidden="true"></i>เพิ่มหมายเหตุ</button><textarea class="note-field" id="nf-${it.id}" placeholder="รายละเอียด เช่น เลขโฉนด, ยอดเงิน, ผู้เกี่ยวข้อง..."></textarea></div></label></div>`;
  }).join('');
  div.innerHTML=`<div class="sec-hdr" onclick="toggle('${s.id}')"><div class="sec-ic"><i class="ti ${s.icon}" aria-hidden="true"></i></div><span class="sec-title">${s.title}</span><span class="sec-badge" id="bd-${s.id}">0/${s.items.length}</span><i class="ti ti-chevron-down sec-chevron" id="cv-${s.id}" aria-hidden="true"></i></div><div class="sec-body" id="sb-${s.id}">${items}</div>`;
  wrap.appendChild(div);
});

function toggle(id){
  const b=document.getElementById('sb-'+id),c=document.getElementById('cv-'+id);
  b.classList.toggle('open');c.classList.toggle('open');
}
function toggleNote(id){
  const f=document.getElementById('nf-'+id),b=document.getElementById('nb-'+id);
  const o=f.classList.toggle('open');
  b.innerHTML=`<i class="ti ti-pencil" style="font-size:12px" aria-hidden="true"></i>${o?'ซ่อนหมายเหตุ':'เพิ่มหมายเหตุ'}`;
}
function onChk(cb){
  document.getElementById('row-'+cb.id).classList.toggle('checked-item',cb.checked);
  updateStats();
}
function updateStats(){
  let chk=0,warn=0,tot=0;
  document.querySelectorAll('.item input[type=checkbox]').forEach(cb=>{
    tot++;
    if(cb.checked){
      chk++;
      const row=document.getElementById('row-'+cb.id);
      if(row.querySelector('.tag-warn,.tag-danger'))warn++;
    }
  });
  document.getElementById('cnt-chk').textContent=chk;
  document.getElementById('cnt-warn').textContent=warn;
  document.getElementById('cnt-tot').textContent=tot;
  const pct=tot>0?Math.round(chk/tot*100):0;
  document.getElementById('pbar').style.width=pct+'%';
  document.getElementById('pct-lbl').textContent=pct+'% ของรายการทั้งหมด';
  SECTIONS.forEach(s=>{
    let sc=0;
    s.items.forEach(it=>{const cb=document.getElementById(it.id);if(cb&&cb.checked)sc++;});
    document.getElementById('bd-'+s.id).textContent=sc+'/'+s.items.length;
  });
}
updateStats();
</script>
